# nginx — memory. subdomain configuration
#
# Routes: memory.yourdomain.com → memory-hub container (port 3456)
#
# Security:
#   D4 (primary):  Bearer token checked at nginx level — returns 401 before
#                   the request reaches memory-hub.
#   D10:           memory-hub ALSO validates Bearer via crypto.timingSafeEqual()
#                  (defense-in-depth; nginx's string comparison is not timing-safe
#                   but acceptable since HTTPS already protects the channel).
#   HTTPS only:    HTTP → HTTPS redirect. Let's Encrypt via certbot.
#
# Setup:
#   1. Replace memory.yourdomain.com with your actual subdomain.
#   2. Obtain certificate: certbot --nginx -d memory.yourdomain.com
#   3. Set MEMORY_API_KEY in /etc/nginx/memory-secrets.conf (see below).
#   4. nginx -t && systemctl reload nginx

# ─── Rate limiting (DoS + brute-force protection) ─────────────────────────────
# 30 requests/minute per IP with burst of 10.
# At the http context — must be outside server blocks.
# NOTE: In nginx site config, limit_req_zone must be in http context.
# Place this in /etc/nginx/nginx.conf http{} block if not already present,
# OR use include from http context. This file is a server block config;
# the zone declaration belongs in nginx.conf's http {} section:
#
#   limit_req_zone $binary_remote_addr zone=memory_api:10m rate=30r/m;
#
# Activate in this file by adding inside server { }:
#   limit_req zone=memory_api burst=10 nodelay;
#   limit_req_status 429;
#
# The limit_req directives below assume the zone was declared in nginx.conf.

# ─── HTTP → HTTPS redirect ────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name memory.yourdomain.com;

    # Let's Encrypt ACME challenge passthrough
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # All other HTTP traffic → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── HTTPS server ─────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name memory.yourdomain.com;

    # Hide nginx version in Server header and error pages
    server_tokens off;

    # TLS — certificates managed by certbot
    ssl_certificate     /etc/letsencrypt/live/memory.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/memory.yourdomain.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers (applied to all responses from this server block)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Maximum request body: 11MB (application limit is 10MB per D8; 1MB headroom for headers).
    # Without this, nginx's default 1MB limit returns 413 HTML before memory-hub sees the request.
    client_max_body_size 11m;

    # Rate limiting: 30 req/min per IP, burst of 10.
    # Requires: limit_req_zone $binary_remote_addr zone=memory_api:10m rate=30r/m;
    # in nginx.conf http{} block. Comment out if zone not declared.
    limit_req zone=memory_api burst=10 nodelay;
    limit_req_status 429;

    # ─── Bearer auth check (D4) ────────────────────────────────────────────
    # Reject requests with missing or wrong Authorization header before they
    # reach memory-hub. This is the primary auth layer (D4).
    #
    # MEMORY_API_KEY must be set in /etc/nginx/memory-secrets.conf:
    #   set $memory_api_key "your-secret-key-here";
    # Include that file here (it is gitignored):
    include /etc/nginx/memory-secrets.conf;

    # Emergency lockout: if secrets file is misconfigured (empty key),
    # return 503 instead of potentially bypassing auth.
    if ($memory_api_key = "") {
        return 503 '{"error":"service_unavailable","message":"Server misconfigured: API key not set"}';
    }

    # 401 on missing or wrong Bearer token
    set $auth_ok 0;
    if ($http_authorization = "Bearer $memory_api_key") {
        set $auth_ok 1;
    }

    # /health bypasses auth — used by Docker healthcheck probes and uptime monitors.
    # Note: /health reveals {status:"ok",transport:"http"} — acceptable for single-user.
    set $bypass_health 0;
    if ($request_uri = "/health") {
        set $bypass_health 1;
    }

    # Combine: if auth fails AND it's not a health check → 401
    set $auth_required 0;
    if ($auth_ok = 0) {
        set $auth_required 1;
    }
    if ($bypass_health = 1) {
        set $auth_required 0;
    }

    if ($auth_required = 1) {
        return 401 '{"error":"unauthorized","message":"Authorization: Bearer <MEMORY_API_KEY> required"}';
    }

    # ─── Proxy to memory-hub ───────────────────────────────────────────────
    location / {
        proxy_pass http://memory-hub:3456;

        # Pass standard proxy headers
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Forward Authorization header to memory-hub (defense-in-depth D4/D10:
        # memory-hub re-validates Bearer via crypto.timingSafeEqual()).
        proxy_set_header Authorization     $http_authorization;

        # SSE / streaming support (MCP Streamable HTTP uses text/event-stream).
        # proxy_buffering off is critical — SSE events must not be buffered.
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_buffering                    off;
        proxy_cache                        off;
        proxy_read_timeout                 300s;   # memory_think LLM calls can take 2-10s
        proxy_send_timeout                 60s;
        proxy_connect_timeout              10s;

        # Pass upstream Content-Type through unchanged.
        # SSE responses use text/event-stream; JSON-RPC uses application/json.
        # Do NOT add Content-Type at this level — it would override upstream headers.
        proxy_intercept_errors             off;
    }
}

# ─── Setup instructions (for ops reference) ───────────────────────────────────
#
# 1. Create /etc/nginx/memory-secrets.conf (gitignored, not in repo):
#      set $memory_api_key "YOUR_MEMORY_API_KEY_HERE";
#    Generate key: openssl rand -hex 32
#
# 2. Add rate limiting zone to /etc/nginx/nginx.conf http{} block:
#      limit_req_zone $binary_remote_addr zone=memory_api:10m rate=30r/m;
#
# 3. Obtain Let's Encrypt certificate:
#      certbot --nginx -d memory.yourdomain.com
#
# 4. Enable this config:
#      ln -s /path/to/nginx/memory.conf /etc/nginx/sites-enabled/memory.conf
#      nginx -t && systemctl reload nginx
#
# 5. Verify:
#      curl -s -o /dev/null -w "%{http_code}" https://memory.yourdomain.com/mcp
#      # → 401 (no auth)
#      curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer WRONG" https://memory.yourdomain.com/mcp
#      # → 401
#      curl -s -o /dev/null -w "%{http_code}" https://memory.yourdomain.com/health
#      # → 200 (health check bypasses auth)
#      curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $MEMORY_API_KEY" https://memory.yourdomain.com/health
#      # → 200
